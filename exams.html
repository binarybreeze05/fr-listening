<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CO mock exams (FR / EN)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<script>/* apply saved theme before paint */
  (function(){var t=localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme', t);})();
</script>
<link rel="stylesheet" href="style.css?v=3">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f232a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CO exams">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="side-top">
        <h1>Listening</h1>
        <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      </div>
      <div class="modenav">
        <a class="modetab" href="index.html">🎧 2026 · ranked</a>
        <a class="modetab active" href="exams.html">💿 CO mock exams</a>
      </div>
      <input id="search" type="search" placeholder="Search exams, transcripts…" autocomplete="off">
      <div id="filters" class="filters"></div>
      <div id="count" class="count"></div>
    </div>
    <nav id="list"></nav>
  </aside>
  <main id="reader">
    <div id="empty" class="empty">Select an exam on the left. Each exam is one continuous recording — read the transcript top-to-bottom as it plays.</div>
    <article id="entry" hidden>
      <div class="entry-head">
        <button id="back" class="back-btn" type="button">‹ Exams</button>
        <div class="entry-titlebar">
          <h2 id="entry-title"></h2>
        </div>
        <div id="entry-meta" class="entry-meta"></div>
        <div id="entry-note" class="entry-note"></div>
        <div id="hl-bar" class="hl-bar">
          <span id="hl-count" class="hl-count">No highlights yet</span>
          <span class="hl-spacer"></span>
          <button id="hl-csv" class="hl-btn" title="Export highlighted words/phrases as CSV" disabled>⤓ CSV</button>
          <button id="hl-txt" class="hl-btn" title="Export as text" disabled>⤓ TXT</button>
          <button id="hl-clear" class="hl-btn" title="Remove all highlights" disabled>Clear</button>
        </div>
      </div>
      <div class="seg-head"><div>Français <span class="hl-hint">· select text to highlight unfamiliar words, tap/click one to remove</span></div><div>English</div></div>
      <div id="segs"></div>
      <div id="questions"></div>
    </article>
  </main>
</div>
<footer id="bar">
  <div class="np"><span id="np-title">Nothing playing</span></div>
  <audio id="player" controls preload="none" playsinline></audio>
  <label class="cont" title="When an exam recording ends, auto-play the next exam">
    <input type="checkbox" id="continuous"> 🔁 Continuous
  </label>
</footer>
<script>window.MODE = 'exams';</script>
<script src="data.js?v=2"></script>
<script src="app.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
